<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen Git</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Academia Galguito - Ultimo Commit</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contactos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Galeria</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="mt-3 mb-3">
        <h1 class="fw-bold text-center text-primary-emphasis">Academia Galguito</h1>
        <p class="text-center text-primary-emphasis fs-5">El numero 1</p>
        <div class="text-center">
            <button type="button" class="btn btn-outline-primary text-center">Contactalo</button>
        </div>
    </main>
    <section class="mt-3">
        <h2 class="h5 text-primary-emphasis m-4">Envianos tus datos</h2>
        <form action="" class="m-4 p-3 border rounded border-primary">
            <div class="mb-3">
                <label for="nombre" class="form-label">
                    Nombre
                </label>
                <input type="text" class="form-control" id="nombre" required pattern="^[a-zA-Z]{3,50}$">
            </div>
            <div class="mb-3">
                <label for="apellido" class="form-label">
                    Apellido
                </label>
                <input type="text" class="form-control" id="apellido" required pattern="^[a-zA-Z]{2,50}$">
            </div>
            <div class="mb-3">
                <label for="telefono" class="form-label">
                    Telefono
                </label>
                <input type="text" class="form-control" id="telefono" required pattern="^[0-9]{9}$">
            </div>
            <div class="mb-3">
                <label for="correo" class="form-label">
                    Correo electronico
                </label>
                <input type="email" class="form-control" id="correo" required>
            </div>
            <div class="mb-3 d-grid">
                <button type="button" class="btn btn-outline-success">Enviar</button>
            </div>
        </form>
    </section>
    <footer class="bg-dark text-white py-3 text-center">
        <p>Galguito</p>
        <p>2026</p>
    </footer>






    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
